# Таймауты проксирования (кладётся в /etc/nginx/conf.d/, действует глобально).
# Поднимаем потолок ожидания ответа от приложения, чтобы редкий медленный,
# но всё же успешный запрос дожидался ответа, а не отдавал белый экран на 60 с.
# Реальную защиту от «висяков» даёт код (таймауты gspread + кэш), это — подстраховка.
proxy_connect_timeout 5s;
proxy_send_timeout 90s;
proxy_read_timeout 90s;
