<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход — Закупка ароматов</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {font-family: system-ui, -apple-system, sans-serif; margin:0; padding:16px;
              background:#0e1117; color:#fff;}
        .box {max-width:420px; margin:24px auto;}
        h1 {font-size:20px; margin:0 0 4px;}
        .sub {opacity:0.7; font-size:14px; margin-bottom:16px;}
        .switch {display:flex; gap:6px; margin-bottom:16px;}
        .switch button {flex:1; padding:9px; border-radius:6px; border:none; background:#1a1d23;
              color:#fff; opacity:0.6; font-size:14px; cursor:pointer;}
        .switch button.active {opacity:1; background:#2a2f38;}
        form {display:none;}
        form.active {display:block;}
        label {display:block; font-size:13px; opacity:0.8; margin:12px 0 4px;}
        input {width:100%; box-sizing:border-box; padding:12px; border-radius:6px;
              border:1px solid #2a2d34; background:#1a1d23; color:#fff; font-size:16px;}
        .hint {font-size:12px; opacity:0.6; margin-top:4px;}
        .submit {width:100%; margin-top:18px; padding:13px; border:none; border-radius:6px;
              background:#2f6f3e; color:#fff; font-size:16px; cursor:pointer;}
        .msg {background:#2a2d34; border-left:3px solid #c98a3e; padding:10px 12px;
              border-radius:6px; font-size:14px; margin-bottom:14px;}
    </style>
</head>
<body>
<div class="box">
    <h1>Закупка ароматов</h1>
    <div class="sub">Вход по телефону и коду</div>

    {% if msg %}<div class="msg">{{ msg }}</div>{% endif %}

    <div class="switch">
        <button type="button" data-go="login">Вход</button>
        <button type="button" data-go="register">Регистрация</button>
    </div>

    <!-- Вход -->
    <form id="login" method="post" action="/login">
        <label>Телефон</label>
        <input type="tel" name="phone" inputmode="numeric" placeholder="7XXXXXXXXXX"
               value="{{ phone }}" required>
        <div class="hint">В формате 7XXXXXXXXXX (можно с +7 или 8 — приведём сами)</div>
        <label>Код</label>
        <input type="password" name="code" placeholder="ваш код" required>
        <button class="submit" type="submit">Войти</button>
    </form>

    <!-- Регистрация -->
    <form id="register" method="post" action="/register">
        <label>Телефон</label>
        <input type="tel" name="phone" inputmode="numeric" placeholder="7XXXXXXXXXX"
               value="{{ phone }}" required>
        <div class="hint">В формате 7XXXXXXXXXX (можно с +7 или 8 — приведём сами)</div>
        <label>Имя</label>
        <input type="text" name="name" placeholder="как к вам обращаться" required>
        <label>Придумайте код</label>
        <input type="password" name="code" placeholder="минимум 4 символа" required>
        <div class="hint">Код хранится в зашифрованном виде — запомните его.</div>
        <label>Адрес / доставка</label>
        <input type="text" name="address" placeholder="куда доставлять (необязательно)">
        <button class="submit" type="submit">Зарегистрироваться</button>
    </form>

    <!-- Задать код заново (после сброса организатором) -->
    <form id="setcode" method="post" action="/set-code">
        <label>Телефон</label>
        <input type="tel" name="phone" inputmode="numeric" placeholder="7XXXXXXXXXX"
               value="{{ phone }}" required>
        <label>Новый код</label>
        <input type="password" name="code" placeholder="минимум 4 символа" required>
        <button class="submit" type="submit">Сохранить код</button>
    </form>
</div>

<script>
    var tab = "{{ tab }}";
    function show(which) {
        document.querySelectorAll("form").forEach(function (f) {
            f.classList.toggle("active", f.id === which);
        });
        document.querySelectorAll(".switch button").forEach(function (b) {
            // подсвечиваем «Вход» и для setcode, «Регистрация» — для register
            var on = (b.dataset.go === "register") ? (which === "register")
                                                   : (which !== "register");
            b.classList.toggle("active", on);
        });
    }
    document.querySelectorAll(".switch button").forEach(function (b) {
        b.addEventListener("click", function () { show(b.dataset.go); });
    });
    show(tab === "register" ? "register" : (tab === "setcode" ? "setcode" : "login"));
</script>
</body>
</html>
